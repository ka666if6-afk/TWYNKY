<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 512 512">
  <defs>
    <!-- Молния зелёная -->
    <linearGradient id="boltGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ff00"></stop>
      <stop offset="100%" stop-color="#00cc00"></stop>
    </linearGradient>

    <!-- Свечение молнии -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff00" stop-opacity="0.6"></stop>
      <stop offset="30%" stop-color="#00cc00" stop-opacity="0.5"></stop>
      <stop offset="60%" stop-color="#009900" stop-opacity="0.4"></stop>
      <stop offset="100%" stop-color="#003300" stop-opacity="0"></stop>
    </radialGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="12" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>

    <style>
      .bolt { fill: url(#boltGrad); filter: url(#glow); }
      .highlight { fill: url(#glowGrad); opacity:0.8; }
      .neuron { fill: #00ff00; opacity:0.8; }
      .link { stroke: #00ff00; stroke-width:2; opacity:0; stroke-linecap:round; }
    </style>
  </defs>

  <!-- Свечение вокруг молнии -->
  <ellipse cx="256" cy="256" rx="180" ry="180" class="highlight">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"></animate>
    <animateTransform attributeName="transform" type="scale" values="1;1.05;1" dur="2s" repeatCount="indefinite" additive="sum"></animateTransform>
  </ellipse>

  <!-- Молния зелёная -->
  <path d="M180 100 L330 100 L250 300 L380 300 L160 460 L280 300 L180 300 Z" class="bolt"></path>

  <!-- Множество нейронов -->
  <g id="neurons">
    <circle cx="256" cy="76" r="3" class="neuron">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"></animate>
    </circle>
    <circle cx="392" cy="140" r="3" class="neuron">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.1s" repeatCount="indefinite"></animate>
    </circle>
    <circle cx="440" cy="256" r="3" class="neuron">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"></animate>
    </circle>
    <circle cx="392" cy="372" r="3" class="neuron">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.3s" repeatCount="indefinite"></animate>
    </circle>
    <circle cx="256" cy="436" r="3" class="neuron">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"></animate>
    </circle>
    <circle cx="120" cy="372" r="3" class="neuron">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite"></animate>
    </circle>
    <circle cx="72" cy="256" r="3" class="neuron">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"></animate>
    </circle>
    <circle cx="120" cy="140" r="3" class="neuron">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.7s" repeatCount="indefinite"></animate>
    </circle>
  </g>

  <!-- Динамические линии между нейронами -->
  <g id="links">
    <line x1="256" y1="76" x2="392" y2="140" class="link">
      <animate attributeName="opacity" values="0;0.7;0" dur="1.2s" repeatCount="indefinite"></animate>
    </line>
    <line x1="392" y1="140" x2="440" y2="256" class="link">
      <animate attributeName="opacity" values="0;0.7;0" dur="1.4s" repeatCount="indefinite"></animate>
    </line>
    <line x1="440" y1="256" x2="392" y2="372" class="link">
      <animate attributeName="opacity" values="0;0.7;0" dur="1.6s" repeatCount="indefinite"></animate>
    </line>
    <line x1="392" y1="372" x2="256" y2="436" class="link">
      <animate attributeName="opacity" values="0;0.7;0" dur="1.8s" repeatCount="indefinite"></animate>
    </line>
    <line x1="256" y1="436" x2="120" y2="372" class="link">
      <animate attributeName="opacity" values="0;0.7;0" dur="2s" repeatCount="indefinite"></animate>
    </line>
    <line x1="120" y1="372" x2="72" y2="256" class="link">
      <animate attributeName="opacity" values="0;0.7;0" dur="2.2s" repeatCount="indefinite"></animate>
    </line>
    <line x1="72" y1="256" x2="120" y2="140" class="link">
      <animate attributeName="opacity" values="0;0.7;0" dur="2.4s" repeatCount="indefinite"></animate>
    </line>
    <line x1="120" y1="140" x2="256" y2="76" class="link">
      <animate attributeName="opacity" values="0;0.7;0" dur="2.6s" repeatCount="indefinite"></animate>
    </line>
  </g>
</svg>
