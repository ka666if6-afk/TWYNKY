<svg xmlns="http://www.w3.org/2000/svg" width="793" height="340" viewBox="0 0 793 340">
  <defs>
    <!-- Градиент для TWYNKY -->
    <linearGradient id="twynkyGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e4ff">
        <animate attributeName="stop-color" values="#00e4ff;#4b7bff;#b45cff;#00e4ff" dur="4s" repeatCount="indefinite"></animate>
      </stop>
      <stop offset="50%" stop-color="#4b7bff">
        <animate attributeName="stop-color" values="#4b7bff;#b45cff;#00e4ff;#4b7bff" dur="4s" repeatCount="indefinite"></animate>
      </stop>
      <stop offset="100%" stop-color="#b45cff">
        <animate attributeName="stop-color" values="#b45cff;#00e4ff;#4b7bff;#b45cff" dur="4s" repeatCount="indefinite"></animate>
      </stop>
    </linearGradient>

    <!-- Градиент для ID -->
    <linearGradient id="idGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffcc00"></stop>
      <stop offset="100%" stop-color="#ff6600"></stop>
    </linearGradient>

    <!-- Фильтр для свечения ID -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>

    <style>
      .brand {
        font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        letter-spacing: 6px;
      }
    </style>
  </defs>

  <!-- TWYNKY крупный -->
  <text x="50%" y="40%" class="brand" font-size="160" fill="url(#twynkyGrad)" text-anchor="middle" dominant-baseline="middle">
    TWYNKY
  </text>

  <!-- ID снизу под TWYNKY с эффектом свечения -->
  <text x="50%" y="70%" class="brand" font-size="100" fill="url(#idGrad)" filter="url(#glow)" text-anchor="middle" dominant-baseline="middle">
    <animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"></animate>
    ID
  </text>
</svg>
